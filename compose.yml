# Compose base (spec 000, CA-3): el mismo archivo en local y staging.
# Local: `docker compose up -d` carga automáticamente `compose.override.yml` (puertos, Mailpit, apps por perfil).
# Staging: `COMPOSE_FILE=compose.yml:compose.staging.yml` (imágenes por SHA, Traefik con TLS, sin puertos internos).
# `WORKER_PORT` nunca aparece en `ports:` (CA-23). ONLYOFFICE solo con `--profile onlyoffice` (CA-2).
name: nimbo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  # Crea el bucket con versionado (D-7) y termina. Idempotente: `mc mb --ignore-existing`.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    restart: 'no'

  traefik:
    image: traefik:v3
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/afmatul/nimbo-api}:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: ${API_MEM_LIMIT:-768m}
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/afmatul/nimbo-worker}:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/afmatul/nimbo-web}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:3000
    mem_limit: 512m
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:9.3.1
    profiles: [onlyoffice]
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost/healthcheck | grep -q true']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 3g
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  onlyoffice_data:
