# nginx de ONLYOFFICE en Deploya, sin root: escucha en `PORT` (> 1024 no hace falta), pid y temporales en /tmp.
# El entrypoint reemplaza __PORT__ y __SECURE_LINK__ (el mismo secreto que `storage.fs.secretString`).
worker_processes 1;
pid /tmp/onlyoffice/nginx/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/onlyoffice/nginx/body;
  proxy_temp_path /tmp/onlyoffice/nginx/proxy;
  fastcgi_temp_path /tmp/onlyoffice/nginx/fastcgi;
  uwsgi_temp_path /tmp/onlyoffice/nginx/uwsgi;
  scgi_temp_path /tmp/onlyoffice/nginx/scgi;

  include /etc/nginx/includes/http-common.conf;

  server {
    listen __PORT__;
    server_tokens off;
    set $secure_link_secret __SECURE_LINK__;
    include /etc/nginx/includes/ds-*.conf;
  }
}
