# Rutas dinámicas locales: `/` → web (host:3002) y `/api` y `/socket.io` → api (host:3000) mientras corren con `pnpm dev`.
# `/socket.io` es el canal en vivo (spec 015, `REALTIME_PATH`); Traefik pasa el `Upgrade` de WebSocket sin configuración extra.
# Prioridad baja a propósito: si se activa el perfil `apps`, los enrutadores por etiquetas de los contenedores
# (prioridad = longitud de la regla) ganan sin tocar este archivo.
http:
  routers:
    web-host:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: web-host
      priority: 1
    api-host:
      rule: PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      entryPoints: [web]
      service: api-host
      priority: 2
  services:
    web-host:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:3002
    api-host:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:3000
