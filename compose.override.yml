# Override local (se carga solo con `docker compose up -d`). Diferencias permitidas por CA-3:
# puertos publicados, Mailpit, Traefik sin TLS enrutando a las apps que corren en el host con `pnpm dev` (R-4)
# y `build` para las apps bajo el perfil `apps` (opcional; CA-1 no lo usa).
services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  # Sin router `/s3` en Traefik (spec 005, R-6): el `stripprefix` invalidaría la firma de las URLs prefirmadas.
  # El navegador usa el puerto 9000 directo (`MINIO_PUBLIC_ENDPOINT`).
  minio:
    ports:
      - '9000:9000'
      - '9001:9001'

  traefik:
    ports:
      - '8080:8080'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./infra/traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/local-routes.yml:/etc/traefik/dynamic/local-routes.yml:ro

  # Correo de desarrollo: UI en http://localhost:8025, SMTP en 1025 (solo local; spec 000 §14).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '8025:8025'
      - '1025:1025'
    mem_limit: 128m
    restart: unless-stopped

  # Local (022, R3): las apps corren en el anfitrión con `pnpm dev`, así que `api`, `worker` y `worker-optimizer`
  # se resuelven hacia el anfitrión. El mismo nombre de servicio sirve en staging, donde no hace falta.
  prometheus:
    extra_hosts:
      - 'api:host-gateway'
      - 'worker:host-gateway'
      - 'worker-optimizer:host-gateway'

  # Correo de alertas de Grafana (022, P-3): Mailpit en local, sin cola `mail` ni `SMTP_*` del worker.
  grafana:
    environment:
      GF_SMTP_HOST: mailpit:1025

  api:
    profiles: [apps]
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      traefik.enable: 'true'
      # `/socket.io`: canal en vivo del `api` (spec 015); el WebSocket pasa sin configuración extra.
      traefik.http.routers.api.rule: PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: '3000'

  worker:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Dentro de la red de compose el SMTP de Mailpit es `mailpit:1025`, no `localhost` (spec 001, ADR-0018).
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'

  # Misma imagen que `worker` (ADR-0038); sin SMTP: no consume `mail`.
  worker-optimizer:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile

  web:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    labels:
      traefik.enable: 'true'
      traefik.http.routers.web.rule: PathPrefix(`/`)
      traefik.http.routers.web.entrypoints: web
      traefik.http.services.web.loadbalancer.server.port: '3002'

  onlyoffice:
    # 016: ONLYOFFICE llama al `api` del host (contenido y aviso de guardado). Solo local/staging: bloquea IP privadas
    # por defecto; `host-gateway` hace que `host.docker.internal` exista también en Linux.
    environment:
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.onlyoffice.rule: PathPrefix(`/docs`)
      traefik.http.routers.onlyoffice.entrypoints: web
      traefik.http.routers.onlyoffice.middlewares: onlyoffice-strip
      traefik.http.middlewares.onlyoffice-strip.stripprefix.prefixes: /docs
      traefik.http.services.onlyoffice.loadbalancer.server.port: '80'
